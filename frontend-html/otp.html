<script src="api-client.js"></script>
<script>
        // ─────────────────────────────────────────────
        // OTP VERIFICATION LOGIC
        // ─────────────────────────────────────────────
        
        const email = Storage.getSignupEmail();
        
        if (!email) {
            alert("❌ No email found. Please sign up first.");
            window.location.href = 'login.html';
        }
        
        const inputs = document.querySelectorAll('#otp-container input');
        
        // Focus first input on load
        if (inputs.length > 0) {
            inputs[0].focus();
        }
        
        // OTP input handlers
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                // Allow only single digit
                if (e.target.value.length > 1) {
                    e.target.value = e.target.value.slice(0, 1);
                }
                // Move to next input when digit entered
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                // Backspace handling
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });

            // Prevent scroll on number inputs
            input.addEventListener('wheel', (e) => e.preventDefault());
        });

        // ─────────────────────────────────────────────
        // OTP FORM SUBMISSION
        // ─────────────────────────────────────────────
        
        document.getElementById('otp-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Combine OTP from 6 inputs
            const otpCode = Array.from(inputs).map(input => input.value).join('');
            
            if (otpCode.length !== 6) {
                UIHelpers.showError('Please enter a valid 6-digit OTP');
                return;
            }
            
            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;
            
            UIHelpers.showLoading(btn, 'Verifying...');
            
            try {
                const result = await APIClient.verifyOTP(email, otpCode);
                
                if (result.success) {
                    // Store authentication data
                    Storage.setAuthToken(result.token);
                    Storage.setUserEmail(result.email);
                    Storage.setUserName(result.name);
                    
                    UIHelpers.showSuccess('Email verified! Redirecting to quiz...');
                    UIHelpers.redirectTo('quiz.html');
                }
            } catch (error) {
                UIHelpers.showError(error.message);
                UIHelpers.hideLoading(btn, originalText);
                
                // Clear OTP inputs on error
                inputs.forEach(input => input.value = '');
                inputs[0].focus();
            }
        });

        // ─────────────────────────────────────────────
        // RESEND OTP BUTTON
        // ─────────────────────────────────────────────
        
        const resendBtn = Array.from(document.querySelectorAll('button')).find(btn => btn.textContent.includes('Resend'));
        
        if (resendBtn) {
            let countdown = 0;
            
            resendBtn.addEventListener('click', async (e) => {
                e.preventDefault();
                
                if (countdown > 0) {
                    UIHelpers.showError(`Please wait ${countdown}s before requesting a new OTP`);
                    return;
                }
                
                try {
                    const result = await APIClient.resendOTP(email);
                    
                    if (result.success) {
                        UIHelpers.showSuccess('New OTP sent to your email');
                        
                        // Disable resend button for 60 seconds
                        countdown = 60;
                        resendBtn.disabled = true;
                        resendBtn.style.opacity = '0.5';
                        
                        const timer = setInterval(() => {
                            countdown--;
                            resendBtn.textContent = `Resend Code (${countdown}s)`;
                            
                            if (countdown <= 0) {
                                clearInterval(timer);
                                resendBtn.disabled = false;
                                resendBtn.style.opacity = '1';
                                resendBtn.textContent = 'Resend Code';
                            }
                        }, 1000);
                        
                        // Clear OTP inputs
                        inputs.forEach(input => input.value = '');
                        inputs[0].focus();
                    }
                } catch (error) {
                    UIHelpers.showError(error.message);
                }
            });
        }

        // Back button
        document.querySelector('a[href="#"]')?.addEventListener('click', (e) => {
            e.preventDefault();
            window.location.href = 'login.html';
        });
    </script>
