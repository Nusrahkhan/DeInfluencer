<script>
const userProfile = {
    skin_type: "Oily",
    concerns: "Acne, Hyperpigmentation",
    budget: "₹₹ (700-1000)",
    preferred_brands: "Minimalist"
};

const backendUrl = "http://localhost:8000/chatbot";
const input = document.getElementById("chatInput");
const sendBtn = document.getElementById("sendButton");
const messagesContainer = document.getElementById("chatMessages");

function scrollToBottom() {
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
}

function createBubble(text, isUser) {
    const wrapper = document.createElement("div");
    wrapper.className = isUser ? "flex justify-end" : "flex gap-4 items-end max-w-[80%]";

    const bubble = document.createElement("div");
    bubble.className = isUser
        ? "bg-primary text-on-primary p-4 rounded-lg chat-bubble-user shadow-sm max-w-[80%]"
        : "bg-surface-container-highest p-5 rounded-lg chat-bubble-ai shadow-sm";

    const paragraph = document.createElement("p");
    paragraph.className = isUser
        ? "text-body-lg leading-relaxed"
        : "text-body-lg text-on-surface-variant leading-relaxed";
    paragraph.textContent = text;

    bubble.appendChild(paragraph);
    wrapper.appendChild(bubble);
    return wrapper;
}

function createHeroCard(hero) {
    const card = document.createElement("div");
    card.className = "relative overflow-hidden bg-gradient-to-br from-[#3d1018] via-[#6b1c2e] to-[#a02035] p-6 rounded-[22px] mb-5";

    const eyebrow = document.createElement("div");
    eyebrow.className = "text-[10.5px] tracking-[0.12em] uppercase text-[rgba(255,200,190,0.72)] mb-2 font-medium";
    eyebrow.textContent = "Personalised for you";

    const title = document.createElement("h2");
    title.className = "font-headline text-[1.85rem] font-semibold text-white leading-tight mb-2";
    title.textContent = hero?.title || "Blossom";

    const subtitle = document.createElement("p");
    subtitle.className = "text-[13.5px] text-[rgba(255,230,225,0.82)] leading-[1.55] p-0 bg-transparent border-0 shadow-none rounded-none max-w-none";
    subtitle.textContent = hero?.subtitle || "";

    const confidence = document.createElement("span");
    confidence.className = `inline-flex items-center gap-2 mt-4 px-3 py-1.5 rounded-full text-[11px] font-semibold tracking-[0.04em] ${hero?.confidence === "high" ? "bg-[rgba(46,190,120,0.18)] text-[#7fffc4] border border-[rgba(46,190,120,0.3)]" : hero?.confidence === "low" ? "bg-[rgba(230,60,60,0.15)] text-[#ffaaaa] border border-[rgba(230,60,60,0.25)]" : "bg-[rgba(250,180,40,0.12)] text-[#ffd98a] border border-[rgba(250,180,40,0.25)]"}`;
    confidence.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-current inline-block"></span>' + (hero?.confidence || "medium") + " confidence";

    card.appendChild(eyebrow);
    card.appendChild(title);
    card.appendChild(subtitle);
    card.appendChild(confidence);
    return card;
}

function createCard(card) {
    const wrapper = document.createElement("div");
    wrapper.className = "beauty-card bg-white border border-[#f0d4c9] rounded-[20px] p-5 mb-4 shadow-sm";

    const title = document.createElement("h3");
    title.className = "font-headline text-[1rem] font-semibold text-[var(--heading)] mb-4";
    title.textContent = card?.title || "Insight";
    wrapper.appendChild(title);

    if (card?.type === "bullet_list") {
        const list = document.createElement("ul");
        list.className = "flex flex-col gap-2.5 list-none p-0 m-0";
        (card.bullets || []).forEach((bullet) => {
            const item = document.createElement("li");
            item.className = "flex items-start gap-2.5 text-[13.5px] leading-[1.5] text-[var(--text)]";
            const dot = document.createElement("span");
            dot.className = "w-1.5 h-1.5 rounded-full bg-gradient-to-br from-[#e87a7a] to-[#c82b31] mt-2 flex-shrink-0";
            const text = document.createElement("span");
            text.textContent = bullet;
            item.appendChild(dot);
            item.appendChild(text);
            list.appendChild(item);
        });
        wrapper.appendChild(list);
        return wrapper;
    }

    if (card?.type === "comparison_table" && card.table) {
        const table = document.createElement("table");
        table.className = "w-full border-collapse";

        const thead = document.createElement("thead");
        const headRow = document.createElement("tr");
        (card.table.columns || []).forEach((column) => {
            const th = document.createElement("th");
            th.className = "py-2.5 px-3 bg-[#fff9f7] border-b border-[#f0d4c9] text-[11px] font-semibold uppercase tracking-[0.07em] text-[var(--text-light)] text-left";
            th.textContent = column;
            headRow.appendChild(th);
        });
        thead.appendChild(headRow);
        table.appendChild(thead);

        const tbody = document.createElement("tbody");
        (card.table.rows || []).forEach((row) => {
            const tr = document.createElement("tr");
            row.forEach((cell) => {
                const td = document.createElement("td");
                td.className = "py-2.5 px-3 border-b border-[#f7ede8] text-[13px] text-[var(--text)]";
                td.textContent = cell;
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        wrapper.appendChild(table);
        return wrapper;
    }

    if (card?.type === "product_grid" && card.products) {
        const grid = document.createElement("div");
        grid.className = "grid gap-3 [grid-template-columns:repeat(auto-fit,minmax(155px,1fr))]";

        card.products.forEach((product) => {
            const link = document.createElement(product.product_url ? "a" : "div");
            if (product.product_url) {
                link.href = product.product_url;
                link.target = "_blank";
                link.rel = "noreferrer";
            }
            link.className = "border border-[#f0d4c9] rounded-[18px] overflow-hidden bg-white text-[var(--text)] flex flex-col transition-transform duration-200 hover:-translate-y-1 shadow-[0_1px_0_rgba(0,0,0,0.02)]";

            const info = document.createElement("div");
            info.className = "p-4 flex flex-col gap-1.5";

            const name = document.createElement("h4");
            name.className = "font-headline text-[15px] font-semibold text-[var(--heading)] leading-[1.3]";
            name.textContent = product.name || "Product";

            const brand = document.createElement("p");
            brand.className = "text-[12px] text-[var(--text-light)] leading-[1.5] p-0 m-0 bg-transparent border-0 shadow-none rounded-none";
            brand.textContent = [product.brand, product.reason].filter(Boolean).join(" • ");

            info.appendChild(name);
            if (brand.textContent) {
                info.appendChild(brand);
            }
            link.appendChild(info);
            grid.appendChild(link);
        });

        wrapper.appendChild(grid);
        return wrapper;
    }

    if (card?.type === "warning") {
        const list = document.createElement("ul");
        list.className = "flex flex-col gap-2.5 list-none p-0 m-0";
        const items = Array.isArray(card.bullets) ? card.bullets : (card.content ? [card.content] : []);
        items.forEach((itemText) => {
            const item = document.createElement("li");
            item.className = "flex items-start gap-2.5 text-[13.5px] leading-[1.5] text-[var(--text)]";
            const dot = document.createElement("span");
            dot.className = "w-1.5 h-1.5 rounded-full bg-gradient-to-br from-[#e87a7a] to-[#c82b31] mt-2 flex-shrink-0";
            const text = document.createElement("span");
            text.textContent = itemText;
            item.appendChild(dot);
            item.appendChild(text);
            list.appendChild(item);
        });
        wrapper.appendChild(list);
        return wrapper;
    }

    return wrapper;
}

function createSources(sources = []) {
    if (!sources.length) return null;

    const container = document.createElement("div");
    container.className = "flex flex-wrap items-center gap-2 mt-5 pt-4 border-t border-[#f5e4de]";

    const label = document.createElement("span");
    label.className = "text-[10.5px] tracking-[0.08em] uppercase text-[var(--text-light)] font-semibold mr-1";
    label.textContent = "Sources";
    container.appendChild(label);

    sources.slice(0, 4).forEach((source) => {
        const link = document.createElement("a");
        link.href = source.url;
        link.target = "_blank";
        link.rel = "noreferrer";
        link.className = "inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white border border-[#f0d4c9] text-[12px] font-medium text-[var(--text)] no-underline transition-all hover:-translate-y-px hover:bg-[#fff5f5] hover:border-[#d08080]";
        link.textContent = source.title || source.url;
        container.appendChild(link);
    });

    return container;
}

function renderAssistantPayload(answer) {
    const bubble = document.createElement("div");
    bubble.className = "flex gap-4 items-end max-w-[80%]";

    const bubbleInner = document.createElement("div");
    bubbleInner.className = "bg-surface-container-highest p-5 rounded-lg chat-bubble-ai shadow-sm w-full";

    if (typeof answer === "string") {
        const text = document.createElement("p");
        text.className = "text-body-lg text-on-surface-variant leading-relaxed";
        text.textContent = answer;
        bubbleInner.appendChild(text);
        bubble.appendChild(bubbleInner);
        return bubble;
    }

    if (answer && typeof answer === "object") {
        if (answer.hero) {
            bubbleInner.appendChild(createHeroCard(answer.hero));
        }

        if (Array.isArray(answer.cards)) {
            answer.cards.forEach((card) => {
                bubbleInner.appendChild(createCard(card));
            });
        }

        if (Array.isArray(answer.sources) && answer.sources.length) {
            const sources = createSources(answer.sources);
            if (sources) {
                bubbleInner.appendChild(sources);
            }
        }

        if (!bubbleInner.children.length) {
            const fallback = document.createElement("p");
            fallback.className = "text-body-lg text-on-surface-variant leading-relaxed";
            fallback.textContent = "Blossom returned an empty response.";
            bubbleInner.appendChild(fallback);
        }

        bubble.appendChild(bubbleInner);
        return bubble;
    }

    return createBubble("Blossom returned an unexpected response.", false);
}

function appendMessage(element) {
    messagesContainer.appendChild(element);
    scrollToBottom();
}

function setLoading(isLoading) {
    sendBtn.disabled = isLoading;
    sendBtn.style.opacity = isLoading ? "0.75" : "1";
}

async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    appendMessage(createBubble(text, true));
    input.value = "";
    setLoading(true);

    try {
        // ✅ Get user email from localStorage
        const email = localStorage.getItem("userEmail");
        
        if (!email) {
            appendMessage(createBubble("User not authenticated. Please log in first.", false));
            setLoading(false);
            return;
        }

        const response = await fetch(backendUrl, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                question: text,
                email: email  // ✅ Send email instead of profile
            })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
            const message = data?.detail || data?.error || `Backend request failed with status ${response.status}`;
            appendMessage(createBubble(message, false));
            return;
        }

        if (data?.error) {
            appendMessage(createBubble(data.error, false));
            return;
        }

        if (data?.answer) {
            appendMessage(renderAssistantPayload(data.answer));
            return;
        }

        appendMessage(createBubble("Blossom returned no answer.", false));
    } catch (error) {
        appendMessage(createBubble("Blossom is unreachable right now. Make sure the local proxy and FastAPI backend are running.", false));
    } finally {
        setLoading(false);
        input.focus();
    }
}


input.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
        event.preventDefault();
        sendMessage();
    }
});

sendBtn.addEventListener("click", sendMessage);

document.querySelectorAll("section.bg-surface-container-lowest button").forEach((button) => {
    const question = button.querySelector("span");
    if (!question) return;

    button.addEventListener("click", () => {
        input.value = question.textContent.trim();
        input.focus();
    });
