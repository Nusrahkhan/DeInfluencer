<!-- Import API Client -->
<script src="api-client.js"></script>

<script>
const container = document.getElementById('authContainer');
const signinBtn = document.getElementById('switchToSignin');
const signupBtn = document.getElementById('switchToSignup');
const signupForm = document.getElementById('signupForm');

signinBtn.addEventListener('click', () => {
    container.classList.add('is-signin');
});

signupBtn.addEventListener('click', () => {
    container.classList.remove('is-signin');
});

// ─────────────────────────────────────────────
// SIGN UP HANDLER
// ─────────────────────────────────────────────
signupForm?.addEventListener('submit', async (event) => {
    event.preventDefault();
    
    // Get all inputs within the signup form
    const inputs = signupForm.querySelectorAll('input');
    const nameInput = inputs[0];           // First input: name
    const emailInput = inputs[1];          // Second input: email
    const passwordInput = inputs[2];       // Third input: password
    const confirmPasswordInput = inputs[3]; // Fourth input: confirm password
    const submitBtn = signupForm.querySelector('button[type="submit"]');
    const originalButtonText = submitBtn.innerHTML;
    
    const name = nameInput?.value.trim() || '';
    const email = emailInput?.value.trim() || '';
    const password = passwordInput?.value || '';
    const confirmPassword = confirmPasswordInput?.value || '';
    
    // Validation
    if (!name || !email || !password || !confirmPassword) {
        UIHelpers.showError('Please fill in all fields');
        return;
    }
    
    UIHelpers.showLoading(submitBtn, 'Signing up...');
    
    try {
        const result = await APIClient.signup(name, email, password, confirmPassword);
        
        if (result.success) {
            // Store email for OTP verification
            Storage.setSignupEmail(email);

            localStorage.setItem('di_user', JSON.stringify({ name: name, email: email }));
            
            UIHelpers.showSuccess('Account created! Redirecting to OTP verification...');
            UIHelpers.redirectTo('otp.html');
        }
    } catch (error) {
        UIHelpers.showError(error.message);
        UIHelpers.hideLoading(submitBtn, originalButtonText);
    }
});

// ─────────────────────────────────────────────
// SIGN IN HANDLER
// ─────────────────────────────────────────────
const signinForm = document.querySelector('.signin-form form');
if (signinForm) {
    signinForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        
        const emailInput = signinForm.querySelector('input[type="email"]');
        const passwordInput = signinForm.querySelector('input[type="password"]');
        const submitBtn = signinForm.querySelector('button[type="submit"]');
        const originalButtonText = submitBtn.innerHTML;
        
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        
        if (!email || !password) {
            UIHelpers.showError('Please enter email and password');
            return;
        }
        
        UIHelpers.showLoading(submitBtn, 'Signing in...');
        
        try {
            const result = await APIClient.signin(email, password);
            
            if (result.success) {
                // Store authentication data
                Storage.setAuthToken(result.token);
                Storage.setUserEmail(result.email);
                Storage.setUserName(result.name);

                localStorage.setItem('di_user', JSON.stringify({ name: result.name, email: result.email }));
                
                UIHelpers.showSuccess('Signed in successfully!');
                UIHelpers.redirectTo('index.html');
            }
        } catch (error) {
            UIHelpers.showError(error.message);
            UIHelpers.hideLoading(submitBtn, originalButtonText);
        }
    });
}

// ─────────────────────────────────────────────
// UI MICRO-INTERACTIONS
// ─────────────────────────────────────────────

// Input focus styling
document.querySelectorAll('input').forEach(input => {
    input.addEventListener('focus', () => {
        const label = input.parentElement.querySelector('label');
        if (label) label.classList.add('text-primary');
    });
    input.addEventListener('blur', () => {
        const label = input.parentElement.querySelector('label');
        if (label) label.classList.remove('text-primary');
    });
});

// Background parallax-lite on mouse move
document.addEventListener('mousemove', (e) => {
    const amount = 5;
    const x = (e.clientX / window.innerWidth - 0.5) * amount;
    const y = (e.clientY / window.innerHeight - 0.5) * amount;
    
    const illust = document.querySelector('.float-anim');
    if(illust) {
        illust.style.transform = `translate(${x}px, ${y}px)`;
    }
});
</script>
